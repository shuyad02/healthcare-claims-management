# Server Configuration
server.port=8080

# Spring Application Name
spring.application.name=healthcare-claims-management

# H2 Database configuration for out-of-the-box instant execution & testing
spring.datasource.url=jdbc:h2:mem:healthcare_claims_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Console setup
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# IMPORTANT: Disable auto SQL script execution for H2 embedded mode.
# schema.sql and data.sql are MySQL-specific — used only when connecting to a real MySQL 8 server.
# For H2, schema is auto-created by JPA/Hibernate ddl-auto and data is seeded by DataInitializer.java
spring.sql.init.mode=never

# Uncomment below lines for direct MySQL 8 Connection in Production / MySQL environment:
# spring.datasource.url=jdbc:mysql://localhost:3306/healthcare_claims_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT Application Properties
app.jwt.secret=HealthcareClaimsManagementSystemSecretKeyForJWTAuth2026SecureKeyPackage
app.jwt.expiration-ms=86400000
